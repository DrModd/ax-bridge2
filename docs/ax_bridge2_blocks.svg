.new{fill:#fff7d6;stroke:#b8860b;stroke-width:2}
.w{fill:none;stroke:#222;stroke-width:2}.wg{fill:none;stroke:#2e7d32;stroke-width:1.6;stroke-dasharray:6 4}
.wr{fill:none;stroke:#b00020;stroke-width:2.4}
