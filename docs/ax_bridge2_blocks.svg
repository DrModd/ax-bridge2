<rect width="1700" height="1140" fill="#fff"/>
<text x="20" y="34" class="h" text-anchor="start">ax-bridge2 — блок-схема: два генератора, синхронный Фокс, обслуживание на 50 МГц</text>
<text x="20" y="56" class="g" text-anchor="start">Три тактовых домена: BCLK входа (оранжевый), 50 МГц — обслуживание (зелёный), MCLK 45,1584 / 49,152 МГц — звук (синий). Красное — MCLK на плате.</text>
<rect x="20" y="90" width="200" height="120" rx="8" class="ex"/>
<text x="120.0" y="112" class="t" text-anchor="middle">генераторы</text>
<text x="120.0" y="128" class="m" text-anchor="middle">на плате D2</text>
<text x="120.0" y="146" class="v" text-anchor="middle">45,1584 МГц (сетка 44,1)</text>
<text x="120.0" y="162" class="v" text-anchor="middle">49,152 МГц (сетка 48)</text>
<text x="120.0" y="178" class="v" text-anchor="middle">OE / мультиплексор</text>
<text x="232" y="130" class="lr" text-anchor="start">MCLK</text>
<polyline points="220,150 300,150 300,112 1660,112" class="wr"/>
<circle cx="300" cy="150" r="4" class="d"/>
<polyline points="300,150 300,205 180,205 180,262" class="wr" marker-end="url(#arr)"/>
<circle cx="760" cy="112" r="4" class="d"/>
<polyline points="760,112 760,138" class="wr" marker-end="url(#arr)"/>
<text x="768" y="130" class="lr" text-anchor="start">MCLK → C11 (GCLKT)</text>
<rect x="20" y="262" width="200" height="66" rx="8" class="ex"/>
<text x="120.0" y="284" class="t" text-anchor="middle">0  Luckfox (Фокс)</text>
<text x="120.0" y="302" class="v" text-anchor="middle">PCM / DoP / DSD, клок от</text>
<text x="120.0" y="318" class="v" text-anchor="middle">нашего MCLK — синхронно</text>
<rect x="20" y="342" width="200" height="52" rx="8" class="ex"/>
<text x="120.0" y="364" class="t" text-anchor="middle">2  Bluetooth</text>
<text x="120.0" y="382" class="v" text-anchor="middle">I2S PCM</text>
<rect x="20" y="408" width="200" height="52" rx="8" class="ex"/>
<text x="120.0" y="430" class="t" text-anchor="middle">3  HDMI I2S</text>
<text x="120.0" y="448" class="v" text-anchor="middle">PCM / DoP / DSD</text>
<rect x="20" y="474" width="200" height="52" rx="8" class="ex"/>
<text x="120.0" y="496" class="t" text-anchor="middle">4  фонокорректор</text>
<text x="120.0" y="514" class="v" text-anchor="middle">AK5572, I2S 192 кГц</text>
<rect x="20" y="560" width="200" height="84" rx="8" class="ex"/>
<text x="120.0" y="582" class="t" text-anchor="middle">1  S/PDIF × 4</text>
<text x="120.0" y="598" class="m" text-anchor="middle">логический уровень</text>
<text x="120.0" y="616" class="v" text-anchor="middle">коакс, оптика,</text>
<text x="120.0" y="632" class="v" text-anchor="middle">AES/EBU, HDMI ARC</text>
<text x="20" y="666" class="lab" text-anchor="start">BCLK — на GCLKT</text>
<rect x="250" y="240" width="270" height="310" rx="10" class="zone" stroke="#c66a00"/>
<text x="262" y="258" class="lab" text-anchor="start">домен BCLK входа</text>
<polyline points="220,295 270,295" class="w" marker-end="url(#ar)"/>
<polyline points="220,368 270,368" class="w" marker-end="url(#ar)"/>
<polyline points="220,434 270,434" class="w" marker-end="url(#ar)"/>
<polyline points="220,500 270,500" class="w" marker-end="url(#ar)"/>
<rect x="270" y="280" width="100" height="240" rx="8" class="bc"/>
<text x="320.0" y="302" class="t" text-anchor="middle">in_mux</text>
<text x="320.0" y="320" class="v" text-anchor="middle">DCS / LUT</text>
<text x="320.0" y="336" class="v" text-anchor="middle">4 BCLK</text>
<text x="320.0" y="352" class="v" text-anchor="middle"></text>
<text x="320.0" y="368" class="v" text-anchor="middle">флаги DSD</text>
<text x="320.0" y="384" class="v" text-anchor="middle">(Фокс, HDMI)</text>
<polyline points="370,400 395,400" class="w" marker-end="url(#ar)"/>
<rect x="395" y="350" width="110" height="100" rx="8" class="bc"/>
<text x="450.0" y="372" class="t" text-anchor="middle">bclk_rx</text>
<text x="450.0" y="390" class="v" text-anchor="middle">I2S / DSD</text>
<text x="450.0" y="406" class="v" text-anchor="middle">приём</text>
<polyline points="505,400 545,400" class="w" marker-end="url(#ar)"/>
<rect x="545" y="360" width="120" height="80" rx="8" class="mc"/>
<text x="605.0" y="382" class="t" text-anchor="middle">afifo</text>
<text x="605.0" y="400" class="v" text-anchor="middle">BCLK → MCLK</text>
<rect x="250" y="560" width="680" height="560" rx="10" class="zone" stroke="#2e7d32"/>
<text x="262" y="578" class="lg" text-anchor="start">домен 50 МГц — обслуживание (не останавливается при смене генератора)</text>
<rect x="20" y="690" width="200" height="70" rx="8" class="ex"/>
<text x="120.0" y="712" class="t" text-anchor="middle">генератор 50 МГц</text>
<text x="120.0" y="730" class="v" text-anchor="middle">на модуле, E2 (GCLKT)</text>
<polyline points="220,725 270,725" class="wg" marker-end="url(#arb)"/>
<polyline points="220,602 270,602" class="w" marker-end="url(#ar)"/>
<rect x="270" y="590" width="150" height="70" rx="8" class="sc"/>
<text x="345.0" y="612" class="t" text-anchor="middle">spdif_rx</text>
<text x="345.0" y="630" class="v" text-anchor="middle">98 Мвыб/с, сетка</text>
<text x="345.0" y="646" class="v" text-anchor="middle">по длине кадра</text>
<polyline points="420,625 545,625" class="w" marker-end="url(#ar)"/>
<rect x="545" y="590" width="120" height="70" rx="8" class="mc"/>
<text x="605.0" y="612" class="t" text-anchor="middle">afifo</text>
<text x="605.0" y="630" class="v" text-anchor="middle">50 МГц → MCLK</text>
<polyline points="665,625 720,625 720,470 790,470" class="w" marker-end="url(#ar)"/>
<polyline points="665,400 720,400 720,470" class="w"/>
<circle cx="720" cy="470" r="4" class="d"/>
<rect x="270" y="690" width="190" height="120" rx="8" class="sc"/>
<text x="365.0" y="712" class="t" text-anchor="middle">частотомер</text>
<text x="365.0" y="730" class="v" text-anchor="middle">отсчёты входа за 5,2 мс</text>
<text x="365.0" y="746" class="v" text-anchor="middle">→ частота и сетка</text>
<text x="365.0" y="762" class="v" text-anchor="middle">44,1 / 48 кГц</text>
<polyline points="450,450 450,545 330,545 330,690" class="wg" marker-end="url(#arb)"/>
<text x="338" y="560" class="lg" text-anchor="start"></text>
<polyline points="345,660 345,690" class="wg" marker-end="url(#arb)"/>
<rect x="500" y="700" width="410" height="190" rx="8" class="new"/>
<text x="705.0" y="722" class="t" text-anchor="middle">менеджер клоков и входов</text>
<text x="705.0" y="740" class="v" text-anchor="middle">вход 0 (Фокс): mclk_sel = MCLK_SEL Фокса</text>
<text x="705.0" y="756" class="v" text-anchor="middle">другие входы: mclk_sel — по частотомеру</text>
<text x="705.0" y="772" class="v" text-anchor="middle">смена: стоп → флаг STM32 → подтверждение</text>
<text x="705.0" y="788" class="v" text-anchor="middle">(или 300 мс) → сброс тракта → mclk_sel</text>
<text x="705.0" y="804" class="v" text-anchor="middle">→ 20 мс на генератор → снова захват</text>
<text x="705.0" y="820" class="v" text-anchor="middle">переключение входов и линий S/PDIF,</text>
<text x="705.0" y="836" class="v" text-anchor="middle">задержки и сторожа</text>
<polyline points="460,760 500,760" class="wg" marker-end="url(#arb)"/>
<polyline points="120,328 120,336 232,336 232,860 500,860" class="wg" marker-end="url(#arb)"/>
<text x="270" y="852" class="lg" text-anchor="start">MCLK_SEL Фокса</text>
<polyline points="560,700 560,682 242,682 242,228 120,228 120,212" class="wg" marker-end="url(#arb)"/>
<text x="128" y="224" class="lg" text-anchor="start">mclk_sel</text>
<rect x="270" y="930" width="250" height="150" rx="8" class="sc"/>
<text x="395.0" y="952" class="t" text-anchor="middle">I2C 0x5A, регистры</text>
<text x="395.0" y="970" class="v" text-anchor="middle">вход, MUTE, ATT, DSD, EQ,</text>
<text x="395.0" y="986" class="v" text-anchor="middle">S/PDIF 0x10–0x13,</text>
<text x="395.0" y="1002" class="v" text-anchor="middle">клоки 0x14–0x16, VERSION 0x20</text>
<rect x="20" y="960" width="200" height="60" rx="6" class="ex"/>
<text x="120" y="986" class="t" text-anchor="middle">STM32H523</text>
<text x="120" y="1004" class="v" text-anchor="middle">I2C3</text>
<polyline points="220,990 270,990" class="w"/>
<polyline points="520,1000 700,1000 700,890" class="wg" marker-end="url(#arb)"/>
<text x="540" y="1020" class="lg" text-anchor="start">управление тракту — уровни через синхронизаторы</text>
