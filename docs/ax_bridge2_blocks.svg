<polyline points="1265,200 1265,510" class="w"/>
<text x="951" y="545" class="lab" text-anchor="start">жёлтые — КИХ на сдвигах и сложениях (CSD), без умножителей, бит в бит</text>
<text x="951" y="562" class="lab" text-anchor="start">с прежними; DSD-фильтр — две дорожки параллельно</text>
<circle cx="1265" cy="355" r="4" class="d"/>
