<polyline points="945,440 1015,440" class="w" marker-end="url(#ar)"/>
<rect x="1015" y="424" width="80" height="32" rx="6" class="new"/>
<text x="1055" y="445" class="v" text-anchor="middle">hd_a ÷2</text>
