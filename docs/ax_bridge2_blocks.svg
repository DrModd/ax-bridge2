<rect x="1500" y="790" width="190" height="80" rx="6" class="ex"/>
<text x="1595" y="820" class="t" text-anchor="middle">AX5689</text>
<text x="1595" y="840" class="v" text-anchor="middle">MCLK — тот же генератор</text>
